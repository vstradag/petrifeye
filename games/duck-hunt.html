<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DUCK HUNT — two pairs of eyes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../shared/style.css" />
<link rel="stylesheet" href="../shared/gaze/gaze-ui.css" />
<link rel="stylesheet" href="../tuning.css" />
<link rel="stylesheet" href="../shared/gaze/duo.css" />
<style>
  /* The setup chrome is shared/gaze/duo.css — MEDUSA's look, so setting up
     reads the same in every experience. Only the game's own layers here. */
  html, body { margin:0; overflow:hidden; background:#000; }
  #dhStage canvas { display:block; }

  /* Reticles and gaze markers, drawn over the game and under the tags. */
  #dhOverlay { position:fixed; inset:0; z-index:900; pointer-events:none; }
</style>
</head>
<body>

<div id="dhStage"></div>
<canvas id="dhOverlay"></canvas>

<div class="mp-boot" id="mpBoot">
  <div class="mp-boot-inner" id="mpBootInner">
    <h1>DUCK <span>HUNT</span></h1>
    <p class="sub">two pairs of eyes, one shot</p>
    <p class="rule">A duck is only shot when <b>both players look at it at once</b>.<br />
      One of you on it marks it with a cross — then the other has to find it too.</p>
    <div class="mp-srcs" id="mpSrcs"></div>
    <pre id="mpBootCmd"></pre>
    <p class="note" id="mpBootState">checking bridges…</p>
    <button class="mp-btn" id="mpStart" disabled>waiting for bridges</button>
    <button class="mp-btn ghost" id="mpSim">test with mouse + arrows</button>
  </div>
</div>

<div class="mp-cal" id="mpCal">
  <p class="mp-cal-msg" id="mpCalMsg"></p>
</div>

<div class="mp-panel" id="mpPanel" style="display:none"></div>
<button class="mp-gear" id="mpGear" title="settings (s)" style="display:none">&#9881;</button>

<div class="tuning-panel tuning-panel-hidden" id="tuning-panel">
  <div class="ma-row">
    <button class="ma-mini" id="dhNewGame">new game (r)</button>
    <button class="ma-mini" id="dhPause">pause (p)</button>
    <button class="ma-mini" id="dhMute">sound (u)</button>
  </div>
  <label>
    <div class="tuning-row"><span>both looking for</span><span id="tv-hold">instant</span></div>
    <input type="range" id="slider-hold" min="0" max="1.5" value="0" step="0.05" />
  </label>
  <label>
    <div class="tuning-row"><span>players needed to shoot</span><span id="tv-needed">2</span></div>
    <select id="select-needed">
      <option value="2" selected>2 — both (the game)</option>
      <option value="1">1 — either (solo test)</option>
    </select>
  </label>
  <label>
    <div class="tuning-row"><span>duck speed</span><span id="tv-pace">50% of original</span></div>
    <input type="range" id="slider-pace" min="25" max="100" value="50" step="5" />
  </label>
  <label>
    <div class="tuning-row"><span>gaze assist</span><span id="tv-assist">170px</span></div>
    <input type="range" id="slider-assist" min="40" max="320" value="170" step="5" />
  </label>
  <label class="tuning-checkbox" title="Learns the wearer's own gaze offset from the ducks they look at, and corrects for it continuously. Off means raw tracker output.">
    <input type="checkbox" id="toggle-autocal" checked />
    <span>auto-calibration (c)</span>
  </label>
  <label class="mp-toggle-row">
    <input type="checkbox" id="toggle-target" checked />
    <span>show gaze target (g)</span>
  </label>
  <label class="mp-toggle-row">
    <input type="checkbox" id="toggle-assist" checked />
    <span>motion assist (a)</span>
  </label>
  <label class="mp-toggle-row" title="Tags must be on screen for gaze to map. Hiding them stops tracking once the cached surface expires.">
    <input type="checkbox" id="toggle-markers" checked />
    <span>screen markers (m)</span>
  </label>
  <label title="Smaller frees screen space but shortens detection range — the tag must still span ~25-30px in the scene camera.">
    <div class="tuning-row"><span>marker size</span><span id="tv-marker">300px</span></div>
    <input type="range" id="slider-marker" min="80" max="600" value="300" step="10" />
  </label>
  <label>
    <div class="tuning-row"><span>feel like</span><span id="tv-profile">auto</span></div>
    <select id="select-profile">
      <option value="">auto (per input)</option>
      <option value="mouse">mouse — precise</option>
      <option value="neon">neon glasses</option>
      <option value="webgazer">webcam — worst case</option>
    </select>
  </label>
</div>

<script src="../vendor/webgazer.js"></script>
<script src="../shared/tracking.js"></script>
<script src="../shared/attention.js"></script>
<script src="../shared/gaze/gaze-assist.js"></script>
<script src="../shared/gaze/auto-calibrate.js"></script>
<script src="../shared/gaze/markers.js"></script>
<script src="../shared/gaze/webgazer-source.js"></script>
<script src="../shared/gaze/gaze-aggregator.js"></script>
<script src="../shared/controls-hint.js"></script>
<script src="../shared/gaze/fixations.js"></script>
<script src="../shared/gaze/target-calibration.js"></script>
<script src="../shared/gaze/session-setup.js"></script>
<script src="../shared/gaze/data-collection.js"></script>
<script src="../shared/gaze/duo-session.js"></script>

<script>
// Add a player by adding a row: each needs its own bridge on its own port.
const PLAYERS = [
  { id: 0, label: "P1", port: 8443, color: "#ff5f5f" },
  { id: 1, label: "P2", port: 8444, color: "#4ecdc4" },
];

// Read by the game bundle (duck-hunt/duckhunt.js) when it loads. The page
// owns the clicks, the keys and the moment the game starts; the game is
// flown at half speed so a duck can be followed by eye, and the stage's corner links are
// gone because the AprilTags sit on top of them.
window.DuckHuntConfig = {
  spritesheet: "duck-hunt/sprites.json",
  assetBase: "duck-hunt/",
  parent: document.getElementById("dhStage"),
  clickToShoot: false,
  links: false,
  keys: false,
  autoStart: false,
  pace: 0.5,
};
</script>
<script src="duck-hunt/duckhunt.js"></script>
<script src="duck-hunt-gaze.js"></script>
</body>
</html>
