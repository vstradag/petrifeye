<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LIVE GAZE — printed sheets</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../shared/gaze/gaze-ui.css" />
<script src="../shared/stylesheets.js" defer></script>
<style>
  /* The page size is set by the script below (the saved exhibition's paper). */
  html, body { margin: 0; background: #2a2c31; color: #e8e6e2; font-family: var(--gaze-mono); }
  .bar { position: sticky; top: 0; z-index: 2; background: #0b0d12; border-bottom: 1px solid #23252c;
         padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .bar h1 { font-size: 13px; font-weight: 400; letter-spacing: .3em; margin: 0; }
  .bar h1 span { color: var(--gaze-red); }
  .bar p { font-size: 11px; color: #8d8b88; margin: 0; line-height: 1.7; flex: 1 1 420px; }
  .bar p b { color: #c98f8f; font-weight: 600; }
  .bar button { font-family: var(--gaze-mono); font-size: 12px; letter-spacing: .1em; cursor: pointer;
                border: 1px solid var(--gaze-red); background: rgba(255,59,59,.1); color: #fff; padding: 9px 16px; }
  .err { color: #c98f8f; font-size: 12px; padding: 30px; line-height: 1.8; }
  .err a { color: #c98f8f; }
  .sheets { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  /* One sheet = one page. Everything inside is positioned in millimetres from
     the layout frozen in the saved exhibition — the one the overview registers
     with the bridges — so what is printed is what is tracked. On screen the
     sheets are shown scaled down (--view); printing uses their real size. */
  .frame { width: calc(var(--pw) * var(--view)); height: calc(var(--ph) * var(--view)); }
  .sheet { position: relative; overflow: hidden; box-shadow: 0 6px 30px rgba(0,0,0,.5);
           transform: scale(var(--view)); transform-origin: 0 0; }
  .sheet .lay { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .sheet img, .sheet svg { position: absolute; display: block; }
  .sheet .label { position: absolute; text-align: center; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis;
                  font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; line-height: 1; }
  .caption { font-size: 11px; color: #8d8b88; margin: -14px 0 0; text-align: center; line-height: 1.7; }
  .caption b { color: #d9c27a; font-weight: 600; }

  @media print {
    html, body { background: #fff; }
    .bar, .caption { display: none; }
    .sheets { padding: 0; gap: 0; display: block; }
    .frame { width: auto; height: auto; }
    .sheet { box-shadow: none; break-after: page; transform: none;
             -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .frame:last-of-type .sheet { break-after: auto; }
  }
</style>
<style id="pageSize"></style>
</head>
<body>
<div class="bar">
  <h1>LIVE <span>GAZE</span> · printed sheets</h1>
  <p id="barNote">Preparing…</p>
  <button id="printBtn" disabled>print</button>
</div>
<div class="sheets" id="sheets"></div>

<script src="../shared/gaze/live-gaze-store.js"></script>
<script src="../shared/gaze/live-gaze-mock.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const mm = (u) => `${u / 10}mm`;       // layout units are 0.1 mm
  const PAGE_MM = { A0: [1189, 841], A3: [420, 297], A4: [297, 210], Letter: [279.4, 215.9] };

  // ?test: a TEST PRINT (from the test prints page). The sheets are laid out
  // exactly as real ones, for the paper given (?paper=A0&tag=120&colors=painting&place=beside),
  // from the session's images (or the included ones) — but not saved, and not
  // the exhibition: nothing tracks this layout.
  const params = new URLSearchParams(location.search);
  const TEST = params.has("test");
  const blobs = new Map();
  let ex, source = "";
  if (TEST) {
    const imgs = await LiveGazeMock.images();
    source = { session: "the images of this session", exhibition: "the saved exhibition's images" }[imgs.source]
      || "the included paintings";
    const size = LiveGazeStore.PAPERS.includes(params.get("paper")) ? params.get("paper") : "A4";
    const paper = { size, tagMm: Number(params.get("tag")) || LiveGazeStore.PAPER_TAG_FOR[size],
                    colors: params.get("colors") === "bw" ? "bw" : "painting",
                    place: params.get("place") };          // normalised by the store
    imgs.forEach((im) => blobs.set(im.slot, im.blob));
    ex = await LiveGazeStore.buildExhibition(imgs.map((im) => ({ ...im, medium: "print" })), paper);
  } else {
    ex = await LiveGazeStore.exhibition();
  }
  if (!ex || !ex.sheets.length) {
    $("sheets").innerHTML = `<div class="err">No printed exhibition is saved yet. On the
      <a href="live-gaze.html">upload page</a>, choose <b>printed</b> for the images and press
      <b>print</b> there: that saves the sheets into the project's <b>exhibition/</b> folder first,
      and this page prints from it.</div>`;
    $("barNote").textContent = "";
    return;
  }
  const want = (new URLSearchParams(location.search).get("sheets") || "")
    .split(",").filter(Boolean).map(Number).filter((n) => Number.isInteger(n) && n >= 0);
  const sheets = ex.sheets.filter((s) => !want.length || want.includes(s.slot));

  // Every page is the paper turned landscape; a portrait sheet is laid out
  // portrait and turned sideways onto it, which on paper is the same thing.
  // One page size for the whole job, because browsers print a single size.
  const [L, S] = PAGE_MM[ex.paper.size] || PAGE_MM.A4;
  $("pageSize").textContent = `@page { size: ${L}mm ${S}mm; margin: 0; }`;
  // On screen: as wide as the window allows (an A0 sheet is 4.5 m of CSS px).
  const fitView = () => {
    const pxPerMm = 96 / 25.4;
    const k = Math.min(1, (window.innerWidth - 60) / (L * pxPerMm), 820 / (S * pxPerMm));
    document.documentElement.style.setProperty("--view", String(Math.max(0.05, k)));
  };
  document.documentElement.style.setProperty("--pw", `${L}mm`);
  document.documentElement.style.setProperty("--ph", `${S - 0.5}mm`);
  fitView();
  window.addEventListener("resize", fitView);
  window.addEventListener("beforeprint", () => document.documentElement.style.setProperty("--view", "1"));
  window.addEventListener("afterprint", fitView);

  const loads = [];
  const track = (img) => {
    loads.push(new Promise((resolve) => {
      if (img.complete) return resolve();
      img.addEventListener("load", resolve, { once: true });
      img.addEventListener("error", resolve, { once: true });
    }));
    return img;
  };

  // A tag as vector squares in the sheet's two tones. Its bits come from the
  // bridge's own tag image (/markers/<id>.png: 10 x 10 cells of 60 px, the
  // outer ring the light quiet zone), so the pattern is exactly what the
  // detector looks for; drawing it as squares keeps every edge sharp at any
  // size, which a scaled-up bitmap on an A0 sheet would not.
  const bitsCache = new Map();
  function tagBits(id) {
    if (!bitsCache.has(id)) {
      bitsCache.set(id, new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          const cell = c.width / 10, d = ctx.getImageData(0, 0, c.width, c.height).data;
          const bits = [];
          for (let r = 0; r < 10; r++) {
            const row = [];
            for (let q = 0; q < 10; q++) {
              const x = Math.floor((q + 0.5) * cell), y = Math.floor((r + 0.5) * cell);
              row.push(d[(y * c.width + x) * 4] > 127);   // true = light
            }
            bits.push(row);
          }
          resolve(bits);
        };
        img.onerror = () => resolve(null);
        img.src = `/markers/${id}.png`;
      }));
    }
    return bitsCache.get(id);
  }

  function tagSvg(bits, tones) {
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 10 10");
    svg.setAttribute("shape-rendering", "crispEdges");
    const rect = (x, y, w, h, fill) => {
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", w); r.setAttribute("height", h);
      r.setAttribute("fill", fill);
      svg.appendChild(r);
    };
    rect(0, 0, 10, 10, tones.light);
    for (let r = 0; r < 10; r++) {
      for (let q = 0; q < 10;) {
        if (bits[r][q]) { q++; continue; }
        let e = q;
        while (e < 10 && !bits[r][e]) e++;
        // A hair of overlap so no seam of light shows between dark cells.
        rect(q, r, e - q, 1.02, tones.dark);
        q = e;
      }
    }
    return svg;
  }

  let missingTags = false;
  for (const s of sheets) {
    const lay = s.layout;
    const tones = s.tones || { dark: "#000000", light: "#ffffff" };
    const frame = document.createElement("div");
    frame.className = "frame";
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    // A hair shorter than the page: an exactly page-tall box can spill a
    // blank page after it. Nothing is placed in the last millimetre.
    sheet.style.width = `${L}mm`;
    sheet.style.height = `${S - 0.5}mm`;
    // The passe-partout: the whole page in the light tone (white for B/W).
    sheet.style.background = tones.light;

    const box = document.createElement("div");
    box.className = "lay";
    box.style.width = mm(lay.w);
    box.style.height = mm(lay.h);
    if (!lay.landscape) box.style.transform = `translateY(${S}mm) rotate(-90deg)`;

    const img = new Image();
    // The original file, byte for byte (a test print: the image itself).
    img.src = TEST ? URL.createObjectURL(blobs.get(s.slot)) : LiveGazeStore.exhibitionUrl(s.file);
    track(img);
    Object.assign(img.style, { left: mm(lay.image.x), top: mm(lay.image.y),
                               width: mm(lay.image.w), height: mm(lay.image.h) });
    box.appendChild(img);

    for (let k = 0; k < 4; k++) {
      const bits = await tagBits(s.ids[k]);
      if (!bits) { missingTags = true; continue; }
      const svg = tagSvg(bits, tones);
      const t = lay.tags[k];
      Object.assign(svg.style, { left: mm(t.x), top: mm(t.y), width: mm(lay.size), height: mm(lay.size) });
      box.appendChild(svg);
    }

    // The label: in the paper under the image (else over it), centred there,
    // a centimetre clear of the tags either side. With no paper left above
    // or below the image there is no label: nothing may touch a tag.
    const labelH = Math.max(26, Math.round(lay.h * 0.006));            // 0.1 mm
    const imgBottom = lay.image.y + lay.image.h;
    const below = lay.h - imgBottom, above = lay.image.y;
    const room = Math.max(below, above);
    if (room >= labelH * 2) {
      const top = below >= labelH * 2 ? imgBottom + (below - labelH) / 2 : (above - labelH) / 2;
      const row = lay.tags.filter((t) => below >= labelH * 2 ? t.y >= imgBottom - lay.size : t.y < lay.image.y + lay.size);
      const xs = row.map((t) => t.x).sort((a, b) => a - b);
      const left = xs[0] + lay.size + 100, right = lay.w - xs[xs.length - 1] + 100;
      const label = document.createElement("div");
      label.className = "label";
      Object.assign(label.style, {
        top: mm(top), left: mm(left), right: mm(right),
        fontSize: mm(labelH), color: tones.dark, opacity: "0.6",
      });
      label.textContent = `${TEST ? "TEST PRINT · " : ""}LIVE GAZE · sheet ${s.slot + 1} · ${s.name} · tags ${s.ids.join(" ")} · ` +
        `${ex.paper.size} · ${ex.paper.tagMm} mm · mount flat, keep the four tags uncovered`;
      box.appendChild(label);
    }

    sheet.appendChild(box);
    frame.appendChild(sheet);
    $("sheets").appendChild(frame);
    const dpi = Math.round(s.w / (lay.image.w / 254));
    const cap = document.createElement("p");
    cap.className = "caption";
    cap.innerHTML = `sheet ${s.slot + 1} — ${s.name}` + (lay.landscape ? "" : " · portrait, printed sideways") +
      ` · image ${(lay.image.w / 10).toFixed(0)} × ${(lay.image.h / 10).toFixed(0)} mm at <b>${dpi} dpi</b>` +
      (dpi < 100 ? " — soft up close; a larger original prints sharper" : "") +
      ` · tags ${s.ids.join(" ")} in ${tones.dark} on ${tones.light}`;
    $("sheets").appendChild(cap);
  }

  await Promise.all(loads);
  const broken = [...document.querySelectorAll(".sheet img")].filter((i) => !i.naturalWidth);
  if (missingTags || broken.length) {
    $("barNote").innerHTML = missingTags
      ? "<b>The tags did not load</b> — this page must be opened from the running app (the bridge " +
        "serves them). Start PetrifEye and open it again from the upload page."
      : "<b>An image did not load</b> from the exhibition/ folder — save the exhibition again from the upload page.";
    return;
  }
  const saved = ex.savedAt ? new Date(ex.savedAt).toLocaleString() : "";
  $("barNote").innerHTML =
    `${sheets.length} sheet${sheets.length === 1 ? "" : "s"}, one per page, ${ex.paper.size} landscape, ` +
    `${ex.paper.tagMm} mm tags — ` +
    (TEST ? `<b>a test print</b> from ${source}, laid out like a real sheet but not saved and not tracked. `
          : `the exhibition saved ${saved}. `) + `For a print shop, choose ` +
    `<b>Save as PDF</b> in the print dialog. Any scale works — <b>don't crop</b> the page, and mount the ` +
    `sheets <b>flat</b> (a bowed sheet bends the tracking with it).`;
  $("printBtn").disabled = false;
  $("printBtn").onclick = () => window.print();
  // Everything is drawn: for a script making PDFs of the test prints.
  document.documentElement.dataset.printReady = "1";
  // Straight to the print dialog: that is what this page was opened for.
  // (?preview shows the sheets without it.)
  if (!new URLSearchParams(location.search).has("preview")) setTimeout(() => window.print(), 300);
})();
</script>
</body>
</html>
