<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>POLITICAL VISION — observer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../shared/gaze/gaze-ui.css" />
<style>
  html, body { margin: 0; height: 100%; background: #050608; color: #e8e6e2;
               font-family: var(--gaze-mono); overflow: hidden; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
          gap: 2px; height: 100vh; background: #1a1c22; }
  .q { position: relative; background: #07080b; overflow: hidden; display: flex; flex-direction: column; }
  .q-head { display: flex; justify-content: space-between; align-items: baseline;
            padding: 10px 16px 6px; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #7a7876; }
  .q-head b { color: #e8e6e2; font-weight: 500; letter-spacing: .12em; text-transform: none; font-size: 12px; }
  .q-body { position: relative; flex: 1; min-height: 0; }
  .q-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- statistics ---- */
  .stats { position: absolute; inset: 0; padding: 4px 22px 16px; display: flex; flex-direction: column; }
  .stats table { width: 100%; border-collapse: collapse; }
  .stats th { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500;
              text-align: right; padding: 6px 0 10px; color: #7a7876; }
  .stats th:first-child { text-align: left; }
  .stats td { text-align: right; padding: 11px 0; border-top: 1px solid #16181e;
              font-variant-numeric: tabular-nums; }
  .stats td:first-child { text-align: left; font-size: 12px; color: #a9a7a3; }
  .stats td .big { font-size: clamp(22px, 3.4vw, 46px); font-weight: 200; color: #f0eee9; }
  .stats td .unit { font-size: 11px; color: #6f6d6a; margin-left: 4px; }
  .stats tr.secondary td .big { font-size: clamp(14px, 1.8vw, 22px); color: #b9b7b3; }
  .stats .foot { margin-top: auto; font-size: 10px; line-height: 1.7; color: #5a5856; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                 color: #2e3038; font-size: 11px; letter-spacing: .4em; text-transform: uppercase; }

  .waiting { position: fixed; inset: 0; z-index: 10; background: rgba(5,6,8,.94);
             display: flex; align-items: center; justify-content: center; text-align: center; }
  .waiting.hidden { display: none; }
  .waiting h1 { font-size: 26px; font-weight: 200; letter-spacing: .34em; margin: 0 0 14px; }
  .waiting h1 span { color: var(--gaze-red); }
  .waiting p { font-size: 12px; line-height: 1.9; color: #8d8b88; max-width: 560px; margin: 0 auto; }
  .keys { position: fixed; right: 10px; bottom: 8px; z-index: 5; font-size: 10px; color: #3c3e46; letter-spacing: .08em; }
</style>
</head>
<body>

<div class="grid">
  <section class="q">
    <div class="q-head"><span>scanpaths</span><b id="q1Title">—</b></div>
    <div class="q-body"><canvas id="q1"></canvas></div>
  </section>

  <section class="q">
    <div class="q-head"><span>live statistics</span><b id="q2Clock"></b></div>
    <div class="q-body"><div class="stats" id="q2"></div></div>
  </section>

  <section class="q">
    <div class="q-head"><span>what the eyes uncovered</span><b id="q3Pct"></b></div>
    <div class="q-body"><canvas id="q3"></canvas></div>
  </section>

  <section class="q">
    <div class="q-head"><span>&nbsp;</span><b></b></div>
    <div class="q-body"><div class="placeholder">reserved</div></div>
  </section>
</div>

<div class="waiting" id="waiting">
  <div>
    <h1>POLITICAL <span>VISION</span></h1>
    <p id="waitingMsg">
      Waiting for the viewer screen.<br />
      Open <b>Political Vision</b> in this same browser — this window
      listens to it directly, so it must be the same browser, not a copy
      opened elsewhere.
    </p>
  </div>
</div>

<div class="keys">n / p cartoon · r reset · f fullscreen</div>

<script src="political-vision-observer.js"></script>
</body>
</html>
